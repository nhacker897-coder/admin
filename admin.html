<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TindahanOS Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif}.i{background:#020617;border:1px solid #1e293b;border-radius:.75rem;padding:.6rem .8rem;color:#fff;font-size:.75rem;width:100%}.b{padding:.4rem .8rem;border-radius:.6rem;font-size:.7rem;font-weight:700}</style></head>
<body class="bg-[#020617] text-slate-100 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><form id="lf" class="bg-slate-900 border border-slate-800 rounded-3xl p-7 w-full max-w-sm space-y-3"><h1 class="font-extrabold text-lg"><i class="fa-solid fa-shield-halved text-amber-400"></i> Owner Sign-In</h1><input id="em" type="email" class="i" placeholder="Owner email" required autocomplete="username"><input id="pw" type="password" class="i" placeholder="Password" required autocomplete="current-password"><p id="le" class="text-rose-400 text-xs"></p><button class="b bg-amber-500 text-slate-950 w-full py-3">Sign In</button></form></div>
<div id="app" class="hidden max-w-6xl mx-auto p-4 space-y-6">
<header class="flex items-center justify-between"><h1 class="font-extrabold text-lg">TindahanOS Admin</h1><div class="flex gap-2"><button data-a="reload" class="b bg-slate-800">Refresh</button><button data-a="out" class="b bg-slate-800">Sign Out</button></div></header>
<div id="newcode" class="hidden bg-emerald-500/10 border border-emerald-500/40 rounded-2xl p-4 flex items-center justify-between gap-3 text-sm"><span>New access code: <b id="nc" class="font-mono text-emerald-300 text-base"></b></span><button data-a="copy" class="b bg-emerald-600">Copy</button></div>
<section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold text-sm mb-3">Pending Payment Requests <span id="pc" class="text-amber-400"></span></h2><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-500 text-left"><tr><th class="p-2">Customer</th><th>Plan</th><th>Amount</th><th>GCash Ref</th><th>Referral</th><th>Date</th><th></th></tr></thead><tbody id="rq"></tbody></table></div></section>
<section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold text-sm mb-3">Create License Manually</h2><div class="grid grid-cols-1 sm:grid-cols-4 gap-2"><input id="mo" class="i" placeholder="Owner / store name"><select id="mt" class="i"><option>COPPER</option><option>SILVER</option><option selected>GOLD</option></select><select id="mb" class="i"><option>ANNUAL</option><option>LIFETIME</option></select><button data-a="create" class="b bg-amber-500 text-slate-950">Generate Code</button></div></section>
<section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5"><h2 class="font-bold text-sm mb-3">Licenses</h2><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-500 text-left"><tr><th class="p-2">Code</th><th>Owner</th><th>Tier</th><th>Billing</th><th>Status</th><th>Activated</th><th>Expires</th><th></th></tr></thead><tbody id="ls"></tbody></table></div></section></div>
<div id="t" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-xs px-4 py-2 rounded-xl hidden z-50"></div>
<script>
const OWNER_UID='vEnT7Y5vGBhiuxzm9vb9Yk4h1v33';
firebase.initializeApp({apiKey:"AIzaSyA-_8bxpBdx7nnzUt2CHKFfl-oEkYuNqp0",authDomain:"tindahanos.firebaseapp.com",projectId:"tindahanos",storageBucket:"tindahanos.firebasestorage.app",messagingSenderId:"396367781740",appId:"1:396367781740:web:dc782d5d819fc32170dd49"});
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp(),$=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t&&t.toDate?t.toDate().toLocaleDateString():'-';
function toast(m){const t=$('t');t.textContent=m;t.classList.remove('hidden');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add('hidden'),3500)}
function audit(action,detail){return db.collection('audit').add({action,detail:String(detail),by:auth.currentUser.uid,at:TS()}).catch(console.error)}
function rnd(n){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(n));return[...b].map(x=>a[x%a.length]).join('')}
async function newCode(){for(let i=0;i<5;i++){const c='TNDHN-'+rnd(4)+'-'+rnd(4);if(!(await db.collection('licenses').doc(c).get()).exists)return c}throw new Error('Could not generate a unique code')}
function showCode(c){$('nc').textContent=c;$('newcode').classList.remove('hidden')}
function expiry(d){if((d.billing||'LIFETIME')==='LIFETIME')return 'Never';if(!d.activatedAt)return 'On activation';const x=d.activatedAt.toDate();x.setDate(x.getDate()+365);return x.toLocaleDateString()}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';try{await auth.signInWithEmailAndPassword($('em').value,$('pw').value)}catch(x){$('le').textContent='Sign-in failed. Check your email and password.'}};
auth.onAuthStateChanged(u=>{const ok=!!u&&!u.isAnonymous&&u.uid===OWNER_UID;$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(u&&!ok){$('le').textContent='This account is not authorized.';auth.signOut()}if(ok)load()});
async function load(){
try{
const r=await db.collection('payment_requests').where('status','==','PENDING').get();
$('pc').textContent='('+r.size+')';
$('rq').innerHTML=r.docs.map(s=>{const d=s.data();return `<tr class="border-t border-slate-800"><td class="p-2"><b>${esc(d.name)}</b><br><span class="text-slate-500">${esc(d.contact)}</span></td><td>${esc(d.tier)} / ${esc(d.billing)}</td><td>₱${esc(d.amountPaid)}</td><td class="font-mono">${esc(d.gcashRef)}</td><td>${esc(d.referral)||'-'}</td><td>${fd(d.createdAt)}</td><td class="whitespace-nowrap"><button data-a="approve" data-id="${s.id}" class="b bg-emerald-600">Approve</button> <button data-a="reject" data-id="${s.id}" class="b bg-rose-600">Reject</button></td></tr>`}).join('')||'<tr><td class="p-3 text-slate-500" colspan="7">No pending requests.</td></tr>';
const l=await db.collection('licenses').limit(300).get();
$('ls').innerHTML=l.docs.map(s=>{const d=s.data(),on=String(d.status).toUpperCase()==='ACTIVE';return `<tr class="border-t border-slate-800"><td class="p-2 font-mono">${esc(s.id)}</td><td>${esc(d.owner)||'-'}</td><td>${esc(d.tier)}</td><td>${esc(d.billing||'LIFETIME')}</td><td class="${on?'text-emerald-400':'text-rose-400'}">${esc(d.status)}</td><td>${d.boundUid?fd(d.activatedAt):'Not yet'}</td><td>${expiry(d)}</td><td class="whitespace-nowrap"><button data-a="toggle" data-id="${s.id}" data-on="${on}" class="b bg-slate-800">${on?'Suspend':'Reactivate'}</button> <button data-a="unbind" data-id="${s.id}" class="b bg-slate-800">Reset Device</button> <button data-a="del" data-id="${s.id}" class="b bg-rose-700">Delete</button></td></tr>`}).join('')||'<tr><td class="p-3 text-slate-500" colspan="8">No licenses yet.</td></tr>';
}catch(e){console.error(e);toast('Could not load data. Check the Firestore rules and your owner UID.')}}
const act={
reload:()=>load(),out:()=>auth.signOut(),
copy:()=>navigator.clipboard.writeText($('nc').textContent).then(()=>toast('Code copied')),
async create(){const o=$('mo').value.trim();if(!o)return toast('Enter the owner or store name.');const c=await newCode();await db.collection('licenses').doc(c).set({status:'ACTIVE',tier:$('mt').value,billing:$('mb').value,owner:o,createdAt:TS()});await audit('CREATE_LICENSE',c);showCode(c);$('mo').value='';load()},
async approve(id){const ref=db.collection('payment_requests').doc(id),r=(await ref.get()).data();if(!r||r.status!=='PENDING')return toast('Request is no longer pending.');if(!confirm('Approve payment from '+r.name+' (GCash ref '+r.gcashRef+')? Make sure you verified it in GCash.'))return;const c=await newCode(),b=db.batch();b.set(db.collection('licenses').doc(c),{status:'ACTIVE',tier:r.tier,billing:r.billing,owner:r.name,createdAt:TS(),fromRequest:id});b.update(ref,{status:'APPROVED',licenseCode:c,reviewedAt:TS()});await b.commit();await audit('APPROVE_REQUEST',id+' -> '+c);showCode(c);load()},
async reject(id){if(!confirm('Reject this request?'))return;await db.collection('payment_requests').doc(id).update({status:'REJECTED',reviewedAt:TS()});await audit('REJECT_REQUEST',id);load()},
async toggle(id,b){const on=b.dataset.on==='true';await db.collection('licenses').doc(id).update({status:on?'SUSPENDED':'ACTIVE'});await audit(on?'SUSPEND':'REACTIVATE',id);load()},
async unbind(id){if(!confirm('Let this code be activated on a new device?'))return;await db.collection('licenses').doc(id).update({boundUid:firebase.firestore.FieldValue.delete()});await audit('RESET_DEVICE',id);load()},
async del(id){if(prompt('Type DELETE to permanently delete '+id)!=='DELETE')return;await db.collection('licenses').doc(id).delete();await audit('DELETE_LICENSE',id);load()}};
document.body.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;try{await act[b.dataset.a](b.dataset.id,b)}catch(x){console.error(x);toast('Action failed: '+(x.code||x.message))}});
</script></body></html>
